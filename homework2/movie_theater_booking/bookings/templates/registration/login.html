{% extends 'bookings/base.html' %}
{# Django's LoginView looks for this exact path. #}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-5">
        <h2 class="mb-3">Sign in</h2>
        {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                <input class="form-control" type="text" name="username" id="{{ form.username.id_for_label }}"
                       value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                <input class="form-control" type="password" name="password" id="{{ form.password.id_for_label }}"
                       autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
