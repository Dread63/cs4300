<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Movie Theater{% endblock %} · Movie Theater</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">🎬 Movie Theater</span>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'movie_list' %}">Movies</a></li>
            </ul>
            {% if user.is_authenticated %}
            {# Sign-out must be a POST in Django 5+, so it's a small form. #}
            <form class="d-flex align-items-center" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <span class="navbar-text me-2">{{ user.username }}</span>
                <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
            </form>
            {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}?next={{ request.path|urlencode }}">Sign in</a>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
